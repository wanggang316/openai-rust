[package]
name = "mcp-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-functions"
path = "src/mcp-functions.rs"

[[bin]]
name = "mcp-streaming"
path = "src/mcp-streaming.rs"

[dependencies]
openai-rust = { path = "../../openai-rust" }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
tokio-stream = "0.1"
futures = "0.3"
serde_json = "1.0"